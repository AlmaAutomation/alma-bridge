[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alma-bridge"
version = "0.1.0"
description = "Adaptive compatibility engine for Alma"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
    "numpy>=1.26.0",
    "certifi>=2024.2.2",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
alma = "alma_bridge.cli.alma_app:main"
alma-bridge = "alma_bridge.main:main"
alma-bridge-shadow-validation = "alma_bridge.cli.shadow_validation:main"
alma-native-lab = "alma_bridge.cli.native_lab:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["alma_bridge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
