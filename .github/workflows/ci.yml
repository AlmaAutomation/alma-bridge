name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

  native-append-cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ mingw-w64

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build shim and append fixtures
        run: bash tests/fixtures/native_runtime/build_fixtures.sh

      - name: Verify fixture digests
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest = json.loads(Path("tests/fixtures/native_runtime/manifest.json").read_text())
          bin_dir = Path("tests/fixtures/native_runtime/bin")
          for digest, name in manifest["fixtures"].items():
              actual = hashlib.sha256((bin_dir / name).read_bytes()).hexdigest()
              assert actual == digest, f"digest mismatch: {name}"
          print(f"verified {len(manifest['fixtures'])} digests")
          PY

      - name: Materialize evidence store
        run: python3 -c "from alma_bridge.native_lab.bootstrap_append_cycle import materialize_committed_store; materialize_committed_store()"

      - name: Append cycle audit gates
        run: |
          pytest tests/native_runtime/test_append_behavior.py \
            tests/native_runtime/test_append_security.py \
            tests/native_runtime/test_anti_simulation.py \
            tests/runtime/test_append_conformance.py \
            tests/release/test_append_cycle_audit.py -q

      - name: Validate release manifest
        run: python3 scripts/generate_append_release_manifest.py
